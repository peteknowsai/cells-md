name = "cells-dashboard"
main = "index.ts"
compatibility_date = "2026-01-01"

# Live-ingress front for the cells dashboard cell. Two Custom Domains,
# both proxy to the same cloudflared tunnel (cloudflared's ingress rules
# fan out by Host header). No auth at the edge — wells.cells.md proved
# the just-works pattern, and the dashboard is for Pete's eyes only.
#
# Deploy: scripts/deploy-cells-dashboard.sh

[[routes]]
pattern = "cells.cells.md"
custom_domain = true

[[routes]]
pattern = "cells-convex.cells.md"
custom_domain = true
