name = "cells-front-brief"
main = "index.ts"
compatibility_date = "2026-01-01"

# Front door for cells.md.
#   www.cells.md   → canonical host
#   /              → landing (cells-landing.html)
#   /brief         → the deck (what-is-cells.html)
#   /gallery       → the image gallery (cells-gallery.html)
#
# index.ts runs first (run_worker_first) and 301-redirects the apex
# cells.md and the legacy brief.cells.md alias to www.cells.md.
# The ./public dir is regenerated by scripts/deploy-front.sh at deploy
# time, so it's gitignored.
# account_id resolved from CLOUDFLARE_ACCOUNT_ID env at deploy time.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "www.cells.md"
custom_domain = true

[[routes]]
pattern = "cells.md"
custom_domain = true

[[routes]]
pattern = "brief.cells.md"
custom_domain = true
