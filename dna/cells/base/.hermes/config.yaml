# hermes harness config — __MODEL__ / __PROVIDER__ / __API_MODE__ / __THINKING__
# substituted at bake time (scripts/bake-egg.sh, hermes branch).
#
# Two subscription-backed paths, selected by the chosen model:
#
#   gpt-5.5 → provider `cells`, api_mode `codex_responses`
#     The cells proxy provider (.hermes/plugins/model-providers/cells/) — a
#     codex_responses (OpenAI Responses API) provider pointed at
#     proxy.cells.md/codex. The proxy swaps the cell's OPENAI_CODEX_API_KEY
#     bearer (= CELLS_PROXY_SECRET) for the real ChatGPT-subscription token.
#
#   opus → provider `cells-anthropic`, api_mode `anthropic_messages`
#     The cells-anthropic provider (.hermes/plugins/model-providers/cells-anthropic/)
#     pointed at proxy.cells.md/anthropic.com. hermes takes its Claude-Code OAuth
#     path (preamble + claude-cli UA + oauth betas) because the base_url contains
#     "anthropic.com"; the proxy swaps CELLS_PROXY_SECRET for the real Claude Max
#     OAuth token. No paid Anthropic key on the cell.
#
# `api_mode` is load-bearing: hermes's runtime provider resolution re-derives
# api_mode from the provider name + base URL and does NOT consult the registered
# ProviderProfile's api_mode. Neither proxy.cells.md/codex nor
# proxy.cells.md/anthropic.com auto-detects, so without this line the provider
# falls through to the chat_completions default — which neither backend serves,
# so every turn would error. The runtime honours an explicit model.api_mode only
# when model.provider matches the runtime provider, hence both keys.
model:
  default: __MODEL__
  provider: __PROVIDER__
  api_mode: __API_MODE__

agent:
  # Reasoning effort — low | medium | high | xhigh.
  reasoning_effort: __THINKING__
